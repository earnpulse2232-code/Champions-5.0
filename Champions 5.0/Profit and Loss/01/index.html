<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Equations - Quiz 1</title>
    <!-- MathJax for Mathematical & Scientific Expressions -->
    <script>
        window.MathJax = { 
            tex: { 
                inlineMath: [['$', '$'], ['\\(', '\\)']], 
                displayMath: [['$$', '$$'], ['\\[', '\\]']] 
            }, 
            startup: { typeset: true } 
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; line-height: 1.6; }
        .quiz-container { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .question-block { border-bottom: 2px solid #edf2f7; padding: 22px 0; }
        .question-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; color: #1a202c; white-space: pre-line; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #fff; border: 2px solid #cbd5e0; border-radius: 8px; padding: 12px 18px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s; outline: none; }
        .option-btn:hover:not(:disabled) { background: #edf2f7; border-color: #a0aec0; }
        .option-btn.correct { background-color: #c6f6d5 !important; border-color: #38a169 !important; color: #22543d; font-weight: bold; }
        .option-btn.incorrect { background-color: #fed7d7 !important; border-color: #e53e3e !important; color: #742a2a; }
        .explanation-box { display: none; margin-top: 15px; padding: 15px; background-color: #ebf8ff; border-left: 5px solid #3182ce; border-radius: 4px; font-size: 0.95rem; }
        .submit-section { text-align: center; margin-top: 30px; }
        .submit-btn { background: #3182ce; color: #fff; border: none; padding: 14px 28px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .submit-btn:hover { background: #2b6cb0; }
        .result-box { display: none; margin-top: 25px; padding: 20px; background: #f7fafc; border: 2px solid #cbd5e0; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Quadratic Equations - Quiz 1</h1>
    <div id="quiz-body"></div>

    <div class="submit-section">
        <button class="submit-btn" onclick="submitQuiz()">Quiz Submit Karein</button>
    </div>

    <div id="result-box" class="result-box"></div>
</div>

<script>
const quizData = [
    {
        q: "1. Find the roots of the equation $x^2 - 3x - 10 = 0$.",
        options: [
            "$x = 5, -2$",
            "$x = -5, 2$",
            "$x = 5, 2$",
            "$x = -5, -2$"
        ],
        answer: 0,
        explanation: " समीकरण $x^2 - 3x - 10 = 0$ के गुणनखंड करने पर: \n $x^2 - 5x + 2x - 10 = 0$ \n $x(x - 5) + 2(x - 5) = 0$ \n $(x - 5)(x + 2) = 0$ \n अत: $x = 5$ और $x = -2$।"
    },
    {
        q: "2. Find the roots of the equation $2x^2 + x - 6 = 0$.",
        options: [
            "$x = \\frac{3}{2}, -2$",
            "$x = -\\frac{3}{2}, 2$",
            "$x = \\frac{3}{2}, 2$",
            "$x = -\\frac{3}{2}, -2$"
        ],
        answer: 1,
        explanation: " समीकरण $2x^2 + x - 6 = 0$ में, $2 \\times (-6) = -12$ (गुणा करने पर -12 और जोड़ने पर +1)। \n $2x^2 + 4x - 3x - 6 = 0$ \n $2x(x + 2) - 3(x + 2) = 0$ \n $(2x - 3)(x + 2) = 0$ \n अत: $x = \\frac{3}{2}$ और $x = -2$।"
    },
    {
        q: "3. Find the roots of the equation $\\sqrt{2}x^2 + 7x + 5\\sqrt{2} = 0$.",
        options: [
            "$x = -\\sqrt{2}, -\\frac{5}{\\sqrt{2}}$",
            "$x = \\sqrt{2}, \\frac{5}{\\sqrt{2}}$",
            "$x = -\\sqrt{2}, \\frac{5}{\\sqrt{2}}$",
            "$x = -\\sqrt{2}, -\\frac{5}{2}$"
        ],
        answer: 3,
        explanation: " समीकरण $\\sqrt{2}x^2 + 7x + 5\\sqrt{2} = 0$ में, $\\sqrt{2} \\times 5\\sqrt{2} = 10$ और जोड़ने पर 7 ($5$ और $2$)। \n $\\sqrt{2}x^2 + 5x + 2x + 5\\sqrt{2} = 0$ \n गुणनखंड करने पर $x = -\\sqrt{2}$ और $x = -\\frac{5}{\\sqrt{2}}$ प्राप्त होते हैं।"
    },
    {
        q: "4. Find the roots of the equation $2x^2 - x + \\frac{1}{8} = 0$.",
        options: [
            "$x = \\frac{1}{2}, \\frac{1}{3}$",
            "$x = \\frac{1}{3}, \\frac{1}{3}$",
            "$x = \\frac{1}{4}, \\frac{1}{2}$",
            "$x = \\frac{1}{4}, \\frac{1}{4}$"
        ],
        answer: 3,
        explanation: " समीकरण $2x^2 - x + \\frac{1}{8} = 0$ को 8 से गुणा करने पर: \n $16x^2 - 8x + 1 = 0$ \n $(4x - 1)^2 = 0$ \n अत: $x = \\frac{1}{4}, \\frac{1}{4}$।"
    },
    {
        q: "5. The sum and product of the roots of $2x^2 - 4x + 3 = 0$ are respectively:",
        options: [
            "$2, \\frac{3}{2}$",
            "$-2, \\frac{3}{2}$",
            "$2, -\\frac{3}{2}$",
            "$-2, -\\frac{3}{2}$"
        ],
        answer: 0,
        explanation: " द्विघात समीकरण $ax^2 + bx + c = 0$ में, \n मूलों का योग (Sum) = $-\\frac{b}{a} = -\\frac{-4}{2} = 2$ \n मूलों का गुणनफल (Product) = $\\frac{c}{a} = \\frac{3}{2}$।"
    },
    {
        q: "6. Find the roots of the equation $x^2 - 3x - 10 = 0$ (Alternate form).",
        options: [
            "$x = 2, 5$",
            "$x = -2, -5$",
            "$x = -2, 5$",
            "$x = 2, -5$"
        ],
        answer: 2,
        explanation: " समीकरण $x^2 - 3x - 10 = 0$ के मूल $x = 5$ और $x = -2$ हैं, यानी विकल्प 3 सही है।"
    },
    {
        q: "7. Find the roots of the equation $6x^2 - x - 2 = 0$.",
        options: [
            "$x = \\frac{1}{2}, \\frac{2}{3}$",
            "$x = -\\frac{1}{2}, \\frac{2}{3}$",
            "$x = \\frac{1}{2}, -\\frac{2}{3}$",
            "$x = -\\frac{1}{2}, -\\frac{2}{3}$"
        ],
        answer: 3,
        explanation: " समीकरण $6x^2 - x - 2 = 0$ में $6 \\times (-2) = -12$ और जोड़ने पर $-1$ ($-4$ और $+3$)। \n $6x^2 - 4x + 3x - 2 = 0$ \n $2x(3x - 2) + 1(3x - 2) = 0$ \n $(2x + 1)(3x - 2) = 0$ \n अत: $x = -\\frac{1}{2}$ और $x = \\frac{2}{3}$।"
    },
    {
        q: "8. If the sum and product of the roots of $ax^2 + bx + c = 0$ are $\\frac{7}{2}$ and $3$ respectively, find the ratio $\\frac{c}{a}$.",
        options: [
            "$\\frac{7}{2}$",
            "$3$",
            "$\\frac{2}{7}$",
            "$\\frac{3}{2}$"
        ],
        answer: 1,
        explanation: " मूलों का गुणनफल $\\frac{c}{a}$ होता है, जो प्रश्न में सीधे $3$ दिया गया है।"
    },
    {
        q: "9. If $\\alpha, \\beta$ are the roots of $ax^2 + bx + c = 0$, find the value of $\\frac{1}{\\alpha} + \\frac{1}{\\beta}$.",
        options: [
            "$-\\frac{b}{c}$",
            "$\\frac{c}{b}$",
            "$\\frac{a}{c}$",
            "$-\\frac{b}{c}$"
        ],
        answer: 3,
        explanation: " $\\frac{1}{\\alpha} + \\frac{1}{\\beta} = \\frac{\\alpha + \\beta}{\\alpha\\beta} = \\frac{-b/a}{c/a} = -\\frac{b}{c}$।"
    },
    {
        q: "10. The sum of the roots of $3x^2 - 5x + 2 = 0$ is $\\frac{5}{3}$. Find the product of its roots.",
        options: [
            "$-\\frac{2}{3}$",
            "$\\frac{2}{3}$",
            "$-\\frac{5}{3}$",
            "$\\frac{5}{3}$"
        ],
        answer: 1,
        explanation: " मूलों का गुणनफल (Product) = $\\frac{c}{a} = \\frac{2}{3}$।"
    }
];

let userAnswers = new Array(quizData.length).fill(null);
let startTime = Date.now();

function renderQuiz() {
    const container = document.getElementById('quiz-body');
    container.innerHTML = '';
    quizData.forEach((item, qIdx) => {
        const qBlock = document.createElement('div');
        qBlock.className = 'question-block';
        qBlock.innerHTML = `
            <div class="question-text">
                ${item.q}
            </div>
            <div class="options-grid" id="opt-container-${qIdx}">
                ${item.options.map((opt, oIdx) => `
                    <button class="option-btn" id="btn-${qIdx}-${oIdx}" onclick="handleOptionClick(${qIdx}, ${oIdx})">${opt}</button>
                `).join('')}
            </div>
            <div class="explanation-box" id="exp-${qIdx}">
                <strong>व्याख्या (Explanation):</strong> ${item.explanation}
            </div>
        `;
        container.appendChild(qBlock);
    });
    if (window.MathJax && window.MathJax.typeset) {
        window.MathJax.typeset();
    }
}

function handleOptionClick(qIdx, selectedIdx) {
    if (userAnswers[qIdx] !== null) return;
    userAnswers[qIdx] = selectedIdx;

    const correctIdx = quizData[qIdx].answer;
    const selectedBtn = document.getElementById(`btn-${qIdx}-${selectedIdx}`);
    const correctBtn = document.getElementById(`btn-${qIdx}-${correctIdx}`);
    const expBox = document.getElementById(`exp-${qIdx}`);

    if (selectedIdx === correctIdx) {
        selectedBtn.classList.add('correct');
    } else {
        selectedBtn.classList.add('incorrect');
        correctBtn.classList.add('correct');
    }

    const allOptions = document.querySelectorAll(`#opt-container-${qIdx} .option-btn`);
    allOptions.forEach(btn => btn.disabled = true);

    expBox.style.display = 'block';
    if (window.MathJax && window.MathJax.typeset) {
        window.MathJax.typeset();
    }
}

function submitQuiz() {
    const totalTime = Math.floor((Date.now() - startTime) / 1000);
    const minutes = Math.floor(totalTime / 60);
    const seconds = totalTime % 60;

    let correctCount = 0;
    let incorrectCount = 0;

    userAnswers.forEach((ans, idx) => {
        if (ans !== null) {
            if (ans === quizData[idx].answer) correctCount++;
            else incorrectCount++;
        }
    });

    const resultBox = document.getElementById('result-box');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `
        कुल प्रश्न: ${quizData.length}<br>
        सही उत्तर: <span style="color:#38a169">${correctCount}</span> | 
        गलत उत्तर: <span style="color:#e53e3e">${incorrectCount}</span> | 
        अनुत्तरित: ${quizData.length - (correctCount + incorrectCount)}<br>
        कुल समय: ${minutes} मिनट ${seconds} सेकंड
    `;
    resultBox.scrollIntoView({ behavior: 'smooth' });
}

window.onload = renderQuiz;
</script>
</body>
</html>
